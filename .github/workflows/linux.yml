name: Linux
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Instalar bibliotecas do Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libfontconfig1 libdbus-1-3
      - run: python -m pip install -r requirements-dev.txt
      - name: Testes sem conta Telegram
        run: python -m pytest -q
      - name: Abrir a janela em perfil temporário
        run: python scripts/smoke_linux.py
      - name: Empacotar fontes e lançador Linux
        run: |
          version=$(python -c 'from watcher import VERSION; print(VERSION)')
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then test "$GITHUB_REF_NAME" = "v$version"; fi
          chmod +x abrir.sh instalar-linux.sh
          git ls-files -z | tar --null -T - --transform='s,^,Telegram-Watcher/,' -czf Telegram-Watcher-linux.tar.gz
          sha256sum Telegram-Watcher-linux.tar.gz > Telegram-Watcher-linux.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: Telegram-Watcher-linux
          path: |
            Telegram-Watcher-linux.tar.gz
            Telegram-Watcher-linux.sha256
          if-no-files-found: error

  publicar:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: linux
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Telegram-Watcher-linux
      - uses: softprops/action-gh-release@v2
        with:
          make_latest: false
          files: |
            Telegram-Watcher-linux.tar.gz
            Telegram-Watcher-linux.sha256
          fail_on_unmatched_files: true
