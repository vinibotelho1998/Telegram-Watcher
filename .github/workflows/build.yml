name: Build Windows

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".gitignore"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-windows
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Gerar executavel
        run: pyinstaller DBXTelegramMonitor.spec --noconfirm

      - name: Instalar Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Gerar instalador
        shell: pwsh
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer.iss'

      - name: Publicar artifact do instalador
        uses: actions/upload-artifact@v4
        with:
          name: DBX-Telegram-Monitor-Setup
          path: installer/*.exe
          if-no-files-found: error

      - name: Publicar release Latest
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          target_commitish: ${{ github.sha }}
          name: Ultima build (main)
          make_latest: true
          overwrite_files: true
          files: installer/*.exe
          body: |
            Build automatica do ultimo commit na branch main.
            Baixe o instalador (Setup) em Assets e execute para instalar.
