name: Build Windows

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".gitignore"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-windows
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Testes
        run: python -m pytest

      - name: Incrementar versao
        id: version
        shell: pwsh
        # Depois dos testes e antes do executavel: o app mostra watcher.VERSION no topo,
        # e sem subir o numero todo build saia com a mesma versao.
        run: |
          $conteudo = Get-Content -Path "watcher/__init__.py" -Raw
          $m = [regex]::Match($conteudo, '(?m)^VERSION\s*=\s*"(\d+)\.(\d+)\.(\d+)"')
          if (-not $m.Success) { throw "Nao achei VERSION no formato X.Y.Z" }
          $nova = "$($m.Groups[1].Value).$($m.Groups[2].Value).$([int]$m.Groups[3].Value + 1)"

          $conteudo = $conteudo -replace '(?m)^VERSION\s*=\s*"\d+\.\d+\.\d+"', "VERSION = `"$nova`""
          Set-Content -Path "watcher/__init__.py" -Value $conteudo -NoNewline

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add watcher/__init__.py
          git commit -m "chore: incrementa versao para $nova [skip ci]"
          git push origin HEAD:main

          echo "version=$nova" >> $env:GITHUB_OUTPUT

      - name: Gerar executavel
        run: pyinstaller TelegramWatcher.spec --noconfirm

      - name: Instalar Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Gerar instalador
        shell: pwsh
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DAppVersion=${{ steps.version.outputs.version }} installer.iss'

      - name: Publicar artifact do instalador
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-Watcher-Setup
          path: installer/*.exe
          if-no-files-found: error

      - name: Publicar release Latest
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          target_commitish: ${{ github.sha }}
          name: Telegram Watcher v${{ steps.version.outputs.version }}
          make_latest: true
          overwrite_files: true
          files: installer/*.exe
          body: |
            Build automatica do commit ${{ github.sha }} na branch main.
            Versao: ${{ steps.version.outputs.version }}
            Baixe o instalador (Setup) em Assets e execute para instalar.
